pipeline:
  name: pricing-service - Agentic Testing Gate
  identifier: pricing_service_agentic_testing_gate
  projectIdentifier: nabagentictesting
  orgIdentifier: default
  tags: {}
  properties:
    ci:
      codebase:
        connectorRef: nabagentictesting
        repoName: nab-agentic-ai-testing-pricing-service
        build: <+input>
        depth: 0
  variables:
    - name: agentApiEndpoint
      type: String
      description: nab-agentic-testing's deployed API endpoint - `terraform output -raw api_endpoint`
      value: https://ihr2wavty0.execute-api.ap-southeast-2.amazonaws.com/v1
    - name: awsRegion
      type: String
      value: ap-southeast-2
    - name: serviceName
      type: String
      value: pricing-service
    - name: ecgRepoUrl
      type: String
      description: Repo holding the `ecg` package used to build the content graph
      value: https://github.com/sonuabraham/test-graph.git
    - name: ecgRepoRef
      type: String
      description: Branch, tag or commit of ecgRepoUrl to build with
      value: main
    - name: ecgS3Bucket
      type: String
      description: S3 bucket the ECG graph is uploaded to
      value: nab-agentic-testing-ecg-artifacts
    - name: ecgS3Prefix
      type: String
      value: ecg-graphs
  stages:
    - stage:
        name: Unit Tests
        identifier: unit_tests
        type: CI
        spec:
          cloneCodebase: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  type: Run
                  name: Install and test
                  identifier: install_and_test
                  spec:
                    shell: Sh
                    command: |-
                      python3 -m pip install --upgrade pip
                      pip install -r requirements-dev.txt
                      pytest tests/ -v --junitxml=unit-tests-junit.xml
                    reports:
                      type: JUnit
                      spec:
                        paths:
                          - unit-tests-junit.xml
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: Ignore
    - stage:
        name: Build ECG Graph
        identifier: build_ecg_graph
        type: CI
        when:
          pipelineStatus: All
        spec:
          cloneCodebase: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  type: Run
                  name: Build and upload ECG graph
                  identifier: build_and_upload_ecg_graph
                  spec:
                    shell: Sh
                    envVariables:
                      ECG_REPO_URL: <+pipeline.variables.ecgRepoUrl>
                      ECG_REPO_REF: <+pipeline.variables.ecgRepoRef>
                      ECG_OUTPUT_DIR: ecg-output
                      ECG_S3_BUCKET: <+pipeline.variables.ecgS3Bucket>
                      ECG_S3_PREFIX: <+pipeline.variables.ecgS3Prefix>
                      SERVICE_NAME: <+pipeline.variables.serviceName>
                      COMMIT_SHA: <+codebase.commitSha>
                      AWS_REGION: <+pipeline.variables.awsRegion>
                      AWS_ACCESS_KEY_ID: <+secrets.getValue("pricing_service_harness_invoker_access_key_id")>
                      AWS_SECRET_ACCESS_KEY: <+secrets.getValue("pricing_service_harness_invoker_secret_access_key")>
                    command: bash scripts/build_ecg_graph.sh
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: Ignore
    - stage:
        name: Agentic Testing Gate
        identifier: agentic_testing_gate
        type: CI
        when:
          pipelineStatus: All
        spec:
          cloneCodebase: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  type: Run
                  name: Run agentic testing gate
                  identifier: run_agentic_gate
                  spec:
                    shell: Sh
                    envVariables:
                      AGENT_API_ENDPOINT: <+pipeline.variables.agentApiEndpoint>
                      AWS_REGION: <+pipeline.variables.awsRegion>
                      SERVICE_NAME: <+pipeline.variables.serviceName>
                      OPENAPI_PATH: src/api/openapi.yaml
                      BUILD_TYPE: <+codebase.build.type>
                      TARGET_BRANCH: <+codebase.targetBranch>
                      SOURCE_BRANCH: <+codebase.branch>
                      COMMIT_SHA: <+codebase.commitSha>
                      HARNESS_INVOKER_ROLE_ARN: arn:aws:iam::294427322916:role/nab-agentic-testing-dev-harness-invoker
                      AWS_ACCESS_KEY_ID: <+secrets.getValue("pricing_service_harness_invoker_access_key_id")>
                      AWS_SECRET_ACCESS_KEY: <+secrets.getValue("pricing_service_harness_invoker_secret_access_key")>
                    command: bash scripts/run_agentic_gate.sh
