# Harness CI pipeline: gates this repo's PRs and pushes on the
# nab-agentic-testing agent-routed pipeline running against the real
# deployed AWS stack (as opposed to nab-agentic-testing's own
# fixture-based simulation pipeline, which needs no AWS account at all -
# see nab-agentic-testing/docs/harness-simulation-pipeline.md for that one).
#
# Prerequisites (see nab-agentic-testing/docs/harness-integration.md and
# this repo's README):
#   1. nab-agentic-testing deployed with `terraform apply` -
#      `terraform output api_endpoint` and `terraform output
#      harness_invoker_user` give you the two values below.
#   2. `aws iam create-access-key --user-name <harness_invoker_user output>`
#      - store the AccessKeyId/SecretAccessKey as Harness secrets named
#      exactly as referenced below (or update the references).
#   3. A Harness GitHub connector for this repo.
#   4. Fill in every `<+input>` below and the `agentApiEndpoint` variable.
pipeline:
  name: pricing-service - Agentic Testing Gate
  identifier: pricing_service_agentic_testing_gate
  projectIdentifier: nabagentictesting
  orgIdentifier: default
  tags: {}
  properties:
    ci:
      codebase:
        connectorRef: nabagentictesting
        repoName: nab-agentic-ai-testing-pricing-service
        build: <+input>
        depth: 0 # full history - the gate needs to diff against a base commit/branch

  variables:
    - name: agentApiEndpoint
      type: String
      description: "nab-agentic-testing's deployed API endpoint - `terraform output -raw api_endpoint`"
      value: https://auijyiqn10.execute-api.ap-southeast-2.amazonaws.com/v1
    - name: awsRegion
      type: String
      value: ap-southeast-2
    - name: serviceName
      type: String
      value: pricing-service

  stages:
    - stage:
        name: Unit Tests
        identifier: unit_tests
        type: CI
        spec:
          cloneCodebase: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  type: Run
                  name: Install and test
                  identifier: install_and_test
                  spec:
                    shell: Sh
                    command: |-
                      python3 -m pip install --upgrade pip
                      pip install -r requirements-dev.txt
                      pytest tests/ -v --junitxml=unit-tests-junit.xml
                    reports:
                      type: JUnit
                      spec:
                        paths:
                          - unit-tests-junit.xml

    - stage:
        name: Agentic Testing Gate
        identifier: agentic_testing_gate
        type: CI
        spec:
          cloneCodebase: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              # Diffs this PR/push against its base branch, calls the
              # deployed nab-agentic-testing API with the before/after
              # OpenAPI spec + changed files, polls for a verdict, and
              # fails the stage on FAIL/timeout - see
              # scripts/run_agentic_gate.sh for the full logic.
              - step:
                  type: Run
                  name: Run agentic testing gate
                  identifier: run_agentic_gate
                  spec:
                    shell: Sh
                    envVariables:
                      AGENT_API_ENDPOINT: <+pipeline.variables.agentApiEndpoint>
                      AWS_REGION: <+pipeline.variables.awsRegion>
                      SERVICE_NAME: <+pipeline.variables.serviceName>
                      OPENAPI_PATH: src/api/openapi.yaml
                      BUILD_TYPE: <+codebase.build.type>
                      TARGET_BRANCH: <+codebase.targetBranch>
                      SOURCE_BRANCH: <+codebase.branch>
                      COMMIT_SHA: <+codebase.commitSha>
                      AWS_ACCESS_KEY_ID: <+secrets.getValue("pricing_service_harness_invoker_access_key_id")>
                      AWS_SECRET_ACCESS_KEY: <+secrets.getValue("pricing_service_harness_invoker_secret_access_key")>
                    command: |-
                      bash scripts/run_agentic_gate.sh
